- name: Setup PostgreSQL
  hosts: vps
  become: true
  vars:
    # become_user: postgres below is a non-root become; without pipelining, Ansible
    # uploads modules to a temp dir under the connecting user's home which the
    # postgres user can't read, causing a "become an unprivileged user" failure.
    ansible_pipelining: true
    postgres_db_backup_retention_days: 14
    postgres_databases:
      - name: catshi
        user: catshi
        password: "{{ secret_catshi_db_password }}"
      - name: bobbie
        user: bobbie
        password: "{{ secret_bobbie_db_password }}"
  vars_files:
    - vault.yml

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Ensure PostgreSQL is started and enabled
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Allow all listen addresses
      become_user: postgres
      community.postgresql.postgresql_alter_system:
        param: listen_addresses
        value: "*"
      notify: Restart PostgreSQL

    - name: Require SCRAM password hashing for new roles
      become_user: postgres
      community.postgresql.postgresql_alter_system:
        param: password_encryption
        value: scram-sha-256

    - name: Look up the pg_hba.conf path
      become_user: postgres
      community.postgresql.postgresql_query:
        query: "SHOW hba_file"
      register: pg_hba_file_result

    - name: Require SCRAM authentication for local TCP connections
      become_user: postgres
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_file_result.query_result[0].hba_file }}"
        contype: host
        address: "{{ item }}"
        databases: all
        users: all
        method: scram-sha-256
      loop:
        - 127.0.0.1/32
        - ::1/128
      notify: Reload PostgreSQL

    - name: Allow the Docker bridge network to reach each database
      become_user: postgres
      community.postgresql.postgresql_pg_hba:
        dest: "{{ pg_hba_file_result.query_result[0].hba_file }}"
        contype: host
        address: 172.16.0.0/12
        databases: "{{ item.name }}"
        users: "{{ item.user }}"
        method: scram-sha-256
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Reload PostgreSQL

    - name: Create database users
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ item.user }}"
        password: "{{ item.password }}"
        state: present
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create databases
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.user }}"
        state: present
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure database backup directories exist
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/{{ item.name }}/db_backups"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Configure daily database backups
      ansible.builtin.cron:
        name: "Backup {{ item.name }} PostgreSQL database"
        user: postgres
        minute: "0"
        hour: "3"
        job: >-
          pg_dump {{ item.name }} | gzip > {{ ansible_facts['user_dir'] }}/{{ item.name }}/db_backups/$(date +\%Y-\%m-\%d).sql.gz
          && find {{ ansible_facts['user_dir'] }}/{{ item.name }}/db_backups -type f -mtime +{{ postgres_db_backup_retention_days }} -delete
      loop: "{{ postgres_databases }}"
      loop_control:
        label: "{{ item.name }}"

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

    - name: Reload PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: reloaded
