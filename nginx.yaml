---
- name: Setup nginx
  hosts: vps
  become: true
  vars_files:
    - vault.yml

  tasks:
    - name: Update apt cache and install NGINX (Ubuntu/Debian)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure NGINX service is started and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
    - name: Add Nginx user to user group
      ansible.builtin.user:
        name: www-data
        groups: "{{ ansible_user }}"
        append: true