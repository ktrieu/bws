- name: Deploy Catshi
  hosts: vps
  vars:
    local_repo: "./build-cache/catshi"
    frontend_path: "{{ local_repo }}/frontend"
    web_server_name: catshi.fun
    remote_web_path: "{{ ansible_facts['user_dir'] }}/catshi-web"
    catshi_api_port: 12001
  vars_files:
    - vault.yml
    - vars/certbot.yml

  tasks:
  - name: Update repository locally
    delegate_to: localhost
    ansible.builtin.git:
      repo: "git@github.com:ktrieu/catshi.git"
      dest: "{{ local_repo }}"
      version: master
      update: yes
    register: git_result
  # Frontend assets are stored in Git LFS; without this the build bundles pointer files.
  # In `git lfs ls-files`, " - " marks a file that is still only a pointer.
  - name: Pull Git LFS objects
    delegate_to: localhost
    ansible.builtin.shell:
      cmd: if git lfs ls-files | grep -q ' - '; then git lfs pull && echo pulled; fi
      chdir: "{{ local_repo }}"
    register: lfs_result
    changed_when: "'pulled' in lfs_result.stdout"
  - name: Install frontend dependencies
    delegate_to: localhost
    ansible.builtin.command:
      cmd: pnpm install --frozen-lockfile
      chdir: "{{ frontend_path }}"
    when: git_result.changed or lfs_result.changed
  - name: Build frontend
    delegate_to: localhost
    ansible.builtin.command:
      cmd: pnpm build
      chdir: "{{ frontend_path }}"
    when: git_result.changed or lfs_result.changed
  - name: Upload frontend build output
    ansible.posix.synchronize:
      src: "{{ frontend_path }}/dist/"
      dest: "{{ remote_web_path }}"
    when: git_result.changed or lfs_result.changed
  - name: Add ownership to web root folder
    ansible.builtin.file:
      path: "{{ remote_web_path }}"
      mode: '750'
    when: git_result.changed or lfs_result.changed
  - name: Issue HTTPS certificate for frontend
    ansible.builtin.include_tasks: tasks/certbot_issue.yml
    vars:
      cert_domain: "{{ web_server_name }}"
  - name: Deploy Nginx template for frontend
    become: true
    ansible.builtin.template:
      src: templates/catshi_nginx.j2
      dest: /etc/nginx/conf.d/catshi.conf
    notify:
      - Reload Nginx
  # CI builds the images after a push, so wait until all of them exist for this commit.
  - name: Wait for GHCR images to be published
    delegate_to: localhost
    ansible.builtin.shell:
      cmd: |
        token=$(curl -sf "https://ghcr.io/token?scope=repository:ktrieu/catshi-{{ item }}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        curl -sf -o /dev/null \
          -H "Authorization: Bearer $token" \
          -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
          "https://ghcr.io/v2/ktrieu/catshi-{{ item }}/manifests/sha-{{ git_result.after }}"
    loop: [api, bot, purser, migrate]
    register: image_check
    until: image_check.rc == 0
    retries: 40
    delay: 30
    changed_when: false
  - name: Start Docker services
    delegate_to: localhost
    community.docker.docker_compose_v2:
      # Images are built and pushed to GHCR by catshi's GitHub Actions workflow.
      build: never
      pull: missing
      project_src: "{{ local_repo }}"
      docker_host: "ssh://ktrieu@{{ ansible_host }}"
      files:
        - docker-compose.yml
        - docker-compose.prod.yml
      state: present
      remove_orphans: true
    environment:
      DISCORD_TOKEN: "{{ secret_discord_token }}"
      GUILD_ID: 1339973104444768276
      PURSER_DISCORD_TOKEN: "{{ secret_purser_discord_token }}"
      CF_ARCHIVE_CHANNEL_ID: 1489099725897601084
      # CI tags images with the full commit SHA, so this pins the deploy to the checked-out commit.
      CATSHI_IMAGE_TAG: "sha-{{ git_result.after }}"
      API_PORT: "{{ catshi_api_port }}"
      FRONTEND_PORT: 12002
      PROD_SQLITE_DIR: "{{ ansible_facts['user_dir'] }}/catshi/db/"
      POSTGRES_URL: "postgres://catshi:{{ secret_catshi_db_password }}@host.docker.internal:5432/catshi"
      FRONTEND_BASE_URL: "https://catshi.fun"
    register: compose_result

  handlers:
    - name: Reload Nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted
