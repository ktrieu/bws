- name: Deploy Catshi 
  hosts: vps
  vars:
    local_repo: "./build-cache/catshi"
  vars_files:
    - vault.yml

  tasks:
  - name: Update repository locally
    delegate_to: localhost
    ansible.builtin.git:
      repo: "git@github.com:ktrieu/catshi.git"
      dest: "{{ local_repo }}"
      version: master
      update: yes
    register: git_result
  - name: Start Docker services
    delegate_to: localhost
    community.docker.docker_compose_v2:
      build: always
      project_src: "{{ local_repo }}"
      docker_host: "ssh://ktrieu@{{ ansible_host }}"
      files:
        - docker-compose.yml
        - docker-compose.prod.yml
      state: present
      remove_orphans: true
    environment:
      DISCORD_TOKEN: "{{ secret_discord_token }}"
      GUILD_ID: 748228407472423015
      SQLX_OFFLINE: true
      API_PORT: 12001
      FRONTEND_PORT: 12002
      PROD_SQLITE_DIR: "{{ ansible_facts['user_dir'] }}/catshi/db/"
    register: compose_result
